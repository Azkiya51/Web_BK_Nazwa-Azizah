<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Edukasi | BK-Care</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
<style>
    /* ---- TAB SCROLL (mobile) ---- */
    .tab-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    /* ---- BADGE WARNA PER TIPE ---- */
    .badge-poster       { background: rgba(41,128,185,0.85); color:#fff; }
    .badge-booklet      { background: rgba(39,174,96,0.85);  color:#fff; }
    .badge-flayer       { background: rgba(230,126,34,0.85); color:#fff; }
    .badge-komik        { background: rgba(155,89,182,0.85); color:#fff; }
    .badge-video        { background: rgba(192,57,43,0.85);  color:#fff; }
    .badge-tiktok       { background: rgba(0,0,0,0.82);      color:#fff; }
    .badge-podcast      { background: rgba(142,68,173,0.85); color:#fff; }
    .badge-ai_avatar    { background: linear-gradient(135deg,rgba(41,128,185,0.9),rgba(142,68,173,0.9)); color:#fff; }

    /* ---- VIDEO PLACEHOLDER ---- */
    .video-placeholder {
        width:100%; height:100%;
        display:flex; align-items:center; justify-content:center;
        background: linear-gradient(135deg,#2c3e50,#34495e);
        color: rgba(255,255,255,0.3);
        font-size: 3rem;
        min-height: 200px;
    }

    .video-wrap { cursor: pointer; }

    /* ---- BTN PLAY ---- */
    .btn-play {
        background: linear-gradient(135deg,#e74c3c,#c0392b) !important;
        color: white !important;
    }
    .btn-play:hover { opacity: 0.88; }

    /* ---- VIDEO MODAL ---- */
    .video-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.88);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .video-modal.show { display: flex; }

    .video-modal-inner {
        background: #1a1a2e;
        border-radius: 16px;
        width: 100%;
        max-width: 860px;
        padding: 20px;
        position: relative;
    }

    .video-modal-close {
        position: absolute;
        top: -14px; right: -14px;
        background: #e74c3c; color: white;
        border: none; border-radius: 50%;
        width: 34px; height: 34px;
        font-size: 1rem; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        z-index: 10;
    }

    .video-title {
        color: white;
        font-weight: 600;
        font-size: 1rem;
        margin-bottom: 14px;
        padding-right: 20px;
    }

    .video-frame-wrap {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 */
        height: 0;
        overflow: hidden;
        border-radius: 10px;
        background: #000;
    }

    .video-frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 10px;
    }

    @media (max-width: 600px) {
        .tab-buttons { gap: 6px; }
        .tab-btn { font-size: 0.78rem; padding: 7px 12px; }
    }

    /* ---- TIKTOK MODAL (portrait 9:16) ---- */
    .tiktok-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.92);
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .tiktok-modal.show { display: flex; }
    .tiktok-modal-inner {
        background: #111;
        border-radius: 20px;
        width: 100%;
        max-width: 380px;
        padding: 16px;
        position: relative;
    }
    .tiktok-frame-wrap {
        position: relative;
        padding-bottom: 177.77%; /* 9:16 */
        height: 0;
        overflow: hidden;
        border-radius: 14px;
        background: #000;
    }
    .tiktok-frame-wrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 14px;
    }
    .tiktok-logo-badge {
        position: absolute;
        top: 10px; left: 10px;
        background: #000;
        color: white;
        border-radius: 8px;
        padding: 4px 10px;
        font-size: 0.78rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 5px;
        z-index: 2;
    }

    /* ---- PODCAST CARD ---- */
    .podcast-card-inner {
        background: linear-gradient(135deg,#1a1a2e,#2c1654);
        border-radius: 14px;
        padding: 16px;
        color: white;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 180px;
    }
    .podcast-wave {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 32px;
    }
    .podcast-wave span {
        width: 4px;
        background: rgba(255,255,255,0.4);
        border-radius: 2px;
        animation: wave 1.2s ease-in-out infinite;
    }
    .podcast-wave span:nth-child(2) { animation-delay: 0.1s; height: 60%; }
    .podcast-wave span:nth-child(3) { animation-delay: 0.2s; height: 90%; }
    .podcast-wave span:nth-child(4) { animation-delay: 0.3s; height: 50%; }
    .podcast-wave span:nth-child(5) { animation-delay: 0.4s; height: 80%; }
    .podcast-wave span:nth-child(6) { animation-delay: 0.2s; height: 40%; }
    .podcast-wave span:nth-child(7) { animation-delay: 0.1s; height: 70%; }
    @keyframes wave {
        0%,100% { transform: scaleY(0.5); }
        50%      { transform: scaleY(1); }
    }
    .podcast-embed-wrap iframe {
        width: 100%;
        border-radius: 10px;
        border: none;
    }

    /* ---- AI AVATAR CARD ---- */
    .ai-avatar-wrap {
        position: relative;
        background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
        border-radius: 14px;
        overflow: hidden;
        min-height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .ai-avatar-glow {
        position: absolute;
        width: 120px; height: 120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(100,200,255,0.35), transparent 70%);
        animation: pulse-glow 2.5s ease-in-out infinite;
    }
    @keyframes pulse-glow {
        0%,100% { transform: scale(1); opacity: 0.7; }
        50%      { transform: scale(1.2); opacity: 1; }
    }
    .ai-avatar-icon {
        position: relative;
        z-index: 1;
        font-size: 3.5rem;
        color: rgba(150,220,255,0.9);
        text-shadow: 0 0 20px rgba(100,200,255,0.8);
    }
    .btn-ai-chat {
        background: linear-gradient(135deg,#3498db,#9b59b6) !important;
        color: white !important;
    }
    .btn-ai-chat:hover { opacity: 0.88; }
</style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
    <a href="/" class="logo"><i class="fas fa-heart-pulse"></i> BK-Care</a>
    <a href="/" class="back-btn"><i class="fas fa-arrow-left"></i> Kembali</a>
</nav>

<!-- Hero -->
<div class="hero-section">
    <div class="tag">📚 Media Edukasi</div>
    <h1>Media Edukasi</h1>
    <p>Kumpulan materi edukasi kesehatan mental dan bimbingan konseling dari Guru BK.</p>
</div>

<!-- Tab + Grid -->
<div class="tab-container">
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="filterMedia('semua')" id="tab-semua">
            <i class="fas fa-th"></i> Semua
            <span class="count-badge" id="count-semua">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('poster')" id="tab-poster">
            <i class="fas fa-image"></i> Poster
            <span class="count-badge" id="count-poster">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('booklet')" id="tab-booklet">
            <i class="fas fa-book-open"></i> Booklet
            <span class="count-badge" id="count-booklet">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('flayer')" id="tab-flayer">
            <i class="fas fa-scroll"></i> Flyer
            <span class="count-badge" id="count-flayer">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('komik')" id="tab-komik">
            <i class="fas fa-book"></i> Komik
            <span class="count-badge" id="count-komik">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('video_animasi')" id="tab-video_animasi">
            <i class="fas fa-film"></i> Video Animasi
            <span class="count-badge" id="count-video_animasi">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('video_explainer')" id="tab-video_explainer">
            <i class="fas fa-play-circle"></i> Video Explainer
            <span class="count-badge" id="count-video_explainer">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('video_ppt')" id="tab-video_ppt">
            <i class="fas fa-desktop"></i> Video PPT
            <span class="count-badge" id="count-video_ppt">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('tiktok')" id="tab-tiktok">
            <i class="fab fa-tiktok"></i> TikTok
            <span class="count-badge" id="count-tiktok">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('podcast')" id="tab-podcast">
            <i class="fas fa-podcast"></i> Podcast
            <span class="count-badge" id="count-podcast">0</span>
        </button>
        <button class="tab-btn" onclick="filterMedia('ai_avatar')" id="tab-ai_avatar">
            <i class="fas fa-robot"></i> AI Avatar
            <span class="count-badge" id="count-ai_avatar">0</span>
        </button>
    </div>

    <div class="media-grid" id="mediaGrid">
        <!-- Skeleton loading -->
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:50%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:40%"></div></div></div>
        <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
    </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-inner">
        <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
        <img src="" id="lightboxImg" alt="">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>
</div>


<!-- TikTok Modal (portrait) -->
<div class="tiktok-modal" id="tiktokModal" onclick="closeTiktokModal(event)">
    <div class="tiktok-modal-inner">
        <button class="video-modal-close" onclick="closeTiktokModal()"><i class="fas fa-times"></i></button>
        <div class="tiktok-logo-badge"><i class="fab fa-tiktok"></i> TikTok</div>
        <div style="color:white;font-weight:600;font-size:0.88rem;margin:10px 0 10px;padding-top:16px" id="tiktokModalTitle"></div>
        <div class="tiktok-frame-wrap">
            <iframe id="tiktokFrame" src="" frameborder="0" allowfullscreen
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        </div>
    </div>
</div>

<!-- Video Modal -->
<div class="video-modal" id="videoModal" onclick="closeVideoModal(event)">
    <div class="video-modal-inner">
        <button class="video-modal-close" onclick="closeVideoModal()"><i class="fas fa-times"></i></button>
        <div class="video-title" id="videoModalTitle"></div>
        <div class="video-frame-wrap">
            <iframe id="videoFrame" src="" frameborder="0" allowfullscreen
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
            </iframe>
        </div>
    </div>
</div>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
    let allMedia = [];
    let currentFilter = 'semua';

    async function loadMedia() {
        try {
            const { data, error } = await db
                .from('media')
                .select('*')
                .order('created_at', { ascending: false });
            if (error) throw error;

            allMedia = data || [];
            updateCounts();
            renderMedia(allMedia);
        } catch (e) {
            document.getElementById('mediaGrid').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-circle" style="color:#e74c3c"></i>
                    <h3>Gagal memuat data</h3>
                    <p>Coba muat ulang halaman. (${e.message})</p>
                </div>`;
        }
    }

    const ALL_TYPES = ['poster','booklet','flayer','komik','video_animasi','video_explainer','video_ppt','tiktok','podcast','ai_avatar'];

    function updateCounts() {
        document.getElementById('count-semua').textContent = allMedia.length;
        ALL_TYPES.forEach(t => {
            const el = document.getElementById('count-' + t);
            if (el) el.textContent = allMedia.filter(m => m.type === t).length;
        });
    }

    function filterMedia(type) {
        currentFilter = type;
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-' + type).classList.add('active');
        const filtered = type === 'semua' ? allMedia : allMedia.filter(m => m.type === type);
        renderMedia(filtered);
    }

    const VIDEO_TYPES = ['video_animasi','video_explainer','video_ppt'];
    const TIKTOK_TYPES = ['tiktok'];
    const PODCAST_TYPES = ['podcast'];
    const AI_AVATAR_TYPES = ['ai_avatar'];

    const TYPE_LABELS = {
        poster: 'Poster', booklet: 'Booklet', flayer: 'Flyer',
        komik: 'Komik', video_animasi: 'Video Animasi',
        video_explainer: 'Video Explainer', video_ppt: 'Video PPT',
        tiktok: 'TikTok', podcast: 'Podcast', ai_avatar: 'AI Avatar'
    };

    const TYPE_ICONS = {
        poster: 'fa-image', booklet: 'fa-book-open', flayer: 'fa-scroll',
        komik: 'fa-book', video_animasi: 'fa-film',
        video_explainer: 'fa-play-circle', video_ppt: 'fa-desktop',
        tiktok: 'fa-tiktok', podcast: 'fa-podcast', ai_avatar: 'fa-robot'
    };

    function isVideo(type)    { return VIDEO_TYPES.includes(type); }
    function isTiktok(type)   { return TIKTOK_TYPES.includes(type); }
    function isPodcast(type)  { return PODCAST_TYPES.includes(type); }
    function isAiAvatar(type) { return AI_AVATAR_TYPES.includes(type); }

    // Ekstrak YouTube/Drive video ID untuk embed
    function getEmbedUrl(url) {
        if (!url) return null;
        // YouTube
        const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (ytMatch) return `https://www.youtube.com/embed/${ytMatch[1]}`;
        // Google Drive
        const driveMatch = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
        if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
        return url;
    }

    function getYoutubeThumbnail(url) {
        const ytMatch = url && url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (ytMatch) return `https://img.youtube.com/vi/${ytMatch[1]}/hqdefault.jpg`;
        return null;
    }

    // Ekstrak TikTok embed URL
    function getTiktokEmbedUrl(url) {
        if (!url) return null;
        // TikTok video URL: tiktok.com/@user/video/1234567890
        const ttMatch = url.match(/tiktok\.com\/@[^/]+\/video\/(\d+)/);
        if (ttMatch) return `https://www.tiktok.com/embed/v2/${ttMatch[1]}`;
        // Already embed URL
        if (url.includes('tiktok.com/embed')) return url;
        return null;
    }

    // Ekstrak Spotify/Anchor podcast embed
    function getPodcastEmbedUrl(url) {
        if (!url) return null;
        // Spotify episode
        const spMatch = url.match(/open\.spotify\.com\/episode\/([a-zA-Z0-9]+)/);
        if (spMatch) return `https://open.spotify.com/embed/episode/${spMatch[1]}`;
        // Spotify show
        const spShow = url.match(/open\.spotify\.com\/show\/([a-zA-Z0-9]+)/);
        if (spShow) return `https://open.spotify.com/embed/show/${spShow[1]}`;
        // Anchor.fm
        if (url.includes('anchor.fm')) return url.replace('anchor.fm', 'anchor.fm').replace('/episodes/', '/embed/episodes/');
        return url;
    }

    function renderMedia(data) {
        const grid = document.getElementById('mediaGrid');
        if (data.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-folder-open"></i>
                    <h3>Belum ada konten</h3>
                    <p>Admin belum menambahkan ${TYPE_LABELS[currentFilter] || 'media'} apapun.</p>
                </div>`;
            return;
        }
        grid.innerHTML = '';
        data.forEach((item, i) => {
            const card = document.createElement('div');
            card.className = 'media-card';
            card.style.animationDelay = (i * 0.06) + 's';
            card.style.opacity = '0';
            const hasFile   = item.file_url && item.file_url.trim() !== '';
            const typeLabel = TYPE_LABELS[item.type] || item.type;
            const typeIcon  = TYPE_ICONS[item.type] || 'fa-file';

            if (isTiktok(item.type)) {
                // ---- CARD TIKTOK ----
                const embedUrl = hasFile ? getTiktokEmbedUrl(item.file_url) : null;
                const thumbSrc = item.image_url || '';
                card.innerHTML = `
                    <div class="media-img-wrap video-wrap" style="background:#000;${embedUrl?'cursor:pointer':''}"
                         ${embedUrl ? `onclick="openTiktokModal('${embedUrl}','${escapeHtml(item.judul)}')"` : ''}>
                        ${thumbSrc ? `<img src="${thumbSrc}" alt="${escapeHtml(item.judul)}" loading="lazy"
                                   onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
                        <div class="video-placeholder" style="background:linear-gradient(135deg,#010101,#1a1a1a);${thumbSrc?'display:none':''}">
                            <i class="fab fa-tiktok" style="color:rgba(255,255,255,0.6)"></i>
                        </div>
                        <span class="media-type-badge badge-tiktok"><i class="fab fa-tiktok"></i> TikTok</span>
                        ${embedUrl ? `<div class="media-overlay"><div class="overlay-icon"><i class="fab fa-tiktok"></i></div></div>` : ''}
                    </div>
                    <div class="media-info">
                        <h3>${escapeHtml(item.judul)}</h3>
                        ${item.deskripsi ? `<p>${escapeHtml(item.deskripsi)}</p>` : ''}
                        <div class="media-actions">
                            ${embedUrl ? `<button class="btn-view btn-play" style="background:linear-gradient(135deg,#010101,#333)!important"
                                onclick="openTiktokModal('${embedUrl}','${escapeHtml(item.judul)}')">
                                <i class="fab fa-tiktok"></i> Tonton TikTok
                            </button>` : '<span style="font-size:0.78rem;color:#bbb"><i class="fas fa-unlink"></i> Belum ada link</span>'}
                            ${hasFile ? `<a href="${item.file_url}" target="_blank" class="btn-download"><i class="fas fa-external-link-alt"></i> Buka</a>` : ''}
                        </div>
                    </div>
                `;
            } else if (isPodcast(item.type)) {
                // ---- CARD PODCAST ----
                const embedUrl = hasFile ? getPodcastEmbedUrl(item.file_url) : null;
                card.innerHTML = `
                    <div class="media-img-wrap" style="cursor:default;overflow:hidden">
                        <div class="podcast-card-inner">
                            <span class="media-type-badge badge-podcast" style="width:fit-content"><i class="fas fa-podcast"></i> Podcast</span>
                            <div style="color:white;font-weight:700;font-size:1rem;line-height:1.3">${escapeHtml(item.judul)}</div>
                            <div class="podcast-wave">
                                <span style="height:40%"></span><span></span><span></span><span></span><span></span><span></span><span></span>
                            </div>
                            ${embedUrl
                                ? `<div class="podcast-embed-wrap"><iframe src="${embedUrl}" height="80" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div>`
                                : `<div style="color:rgba(255,255,255,0.4);font-size:0.8rem"><i class="fas fa-unlink"></i> Belum ada link</div>`}
                        </div>
                    </div>
                    <div class="media-info">
                        <h3>${escapeHtml(item.judul)}</h3>
                        ${item.deskripsi ? `<p>${escapeHtml(item.deskripsi)}</p>` : ''}
                        <div class="media-actions">
                            ${hasFile ? `<a href="${item.file_url}" target="_blank" class="btn-view" style="background:linear-gradient(135deg,#8e44ad,#6c3483)!important;color:white!important;text-decoration:none">
                                <i class="fas fa-headphones"></i> Dengarkan
                            </a>` : ''}
                        </div>
                    </div>
                `;
            } else if (isAiAvatar(item.type)) {
                // ---- CARD AI AVATAR ----
                const thumbSrc = item.image_url || '';
                card.innerHTML = `
                    <div class="media-img-wrap" style="cursor:default">
                        <div class="ai-avatar-wrap">
                            <div class="ai-avatar-glow"></div>
                            ${thumbSrc
                                ? `<img src="${thumbSrc}" alt="${escapeHtml(item.judul)}" loading="lazy"
                                       style="position:relative;z-index:1;width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:0;opacity:0.85">`
                                : `<i class="fas fa-robot ai-avatar-icon"></i>`}
                        </div>
                        <span class="media-type-badge badge-ai_avatar"><i class="fas fa-robot"></i> AI Avatar</span>
                        ${hasFile ? `<div class="media-overlay"><div class="overlay-icon"><i class="fas fa-robot"></i></div></div>` : ''}
                    </div>
                    <div class="media-info">
                        <h3>${escapeHtml(item.judul)}</h3>
                        ${item.deskripsi ? `<p>${escapeHtml(item.deskripsi)}</p>` : ''}
                        <div class="media-actions">
                            ${hasFile ? `<a href="${item.file_url}" target="_blank" class="btn-view btn-ai-chat" style="text-decoration:none">
                                <i class="fas fa-robot"></i> Buka AI Avatar
                            </a>` : '<span style="font-size:0.78rem;color:#bbb"><i class="fas fa-unlink"></i> Belum ada link</span>'}
                        </div>
                    </div>
                `;
            } else if (isVideo(item.type)) {
                // ---- CARD VIDEO ----
                const embedUrl = hasFile ? getEmbedUrl(item.file_url) : null;
                const ytThumb  = hasFile ? getYoutubeThumbnail(item.file_url) : null;
                const thumbSrc = item.image_url || ytThumb || '';

                card.innerHTML = `
                    <div class="media-img-wrap video-wrap" ${embedUrl ? `onclick="openVideoModal('${embedUrl}','${escapeHtml(item.judul)}')"` : ''} style="${embedUrl?'cursor:pointer':''}" >
                        ${thumbSrc
                            ? `<img src="${thumbSrc}" alt="${escapeHtml(item.judul)}" loading="lazy"
                                   onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
                            : ''}
                        <div class="video-placeholder" style="${thumbSrc?'display:none':''}">
                            <i class="fas ${typeIcon}"></i>
                        </div>
                        <span class="media-type-badge badge-video"><i class="fas ${typeIcon}"></i> ${typeLabel}</span>
                        ${embedUrl ? `<div class="media-overlay"><div class="overlay-icon"><i class="fas fa-play"></i></div></div>` : ''}
                    </div>
                    <div class="media-info">
                        <h3>${escapeHtml(item.judul)}</h3>
                        ${item.deskripsi ? `<p>${escapeHtml(item.deskripsi)}</p>` : ''}
                        <div class="media-actions">
                            ${embedUrl ? `<button class="btn-view btn-play" onclick="openVideoModal('${embedUrl}','${escapeHtml(item.judul)}')">
                                <i class="fas fa-play"></i> Putar Video
                            </button>` : '<span style="font-size:0.78rem;color:#bbb"><i class="fas fa-unlink"></i> Belum ada link</span>'}
                            ${hasFile ? `<a href="${item.file_url}" target="_blank" class="btn-download"><i class="fas fa-external-link-alt"></i> Buka</a>` : ''}
                        </div>
                    </div>
                `;
            } else {
                // ---- CARD GAMBAR (poster/booklet/flayer/komik) ----
                const imgSrc = item.image_url || '';
                card.innerHTML = `
                    <div class="media-img-wrap" onclick="openLightbox('${imgSrc}','${escapeHtml(item.judul)}')">
                        <img src="${imgSrc}" alt="${escapeHtml(item.judul)}" loading="lazy"
                             onerror="this.src='https://via.placeholder.com/300x400?text=Gambar+Tidak+Tersedia'">
                        <span class="media-type-badge badge-${item.type}"><i class="fas ${typeIcon}"></i> ${typeLabel}</span>
                        <div class="media-overlay"><div class="overlay-icon"><i class="fas fa-search-plus"></i></div></div>
                    </div>
                    <div class="media-info">
                        <h3>${escapeHtml(item.judul)}</h3>
                        ${item.deskripsi ? `<p>${escapeHtml(item.deskripsi)}</p>` : ''}
                        <div class="media-actions">
                            <button class="btn-view" onclick="openLightbox('${imgSrc}','${escapeHtml(item.judul)}')">
                                <i class="fas fa-eye"></i> Lihat
                            </button>
                            ${hasFile ? `<a href="${item.file_url}" target="_blank" class="btn-download"><i class="fas fa-download"></i> Unduh</a>` : ''}
                        </div>
                    </div>
                `;
            }
            grid.appendChild(card);
            // fade-in
            setTimeout(() => { card.style.opacity = '1'; card.style.transition = 'opacity 0.4s'; }, i * 60);
        });
    }

    function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function openLightbox(imgUrl, caption) {
        document.getElementById('lightboxImg').src = imgUrl;
        document.getElementById('lightboxCaption').textContent = caption;
        document.getElementById('lightbox').classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox(event) {
        if (event && event.target !== document.getElementById('lightbox') && !event.target.closest('.lightbox-close')) return;
        document.getElementById('lightbox').classList.remove('show');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            document.getElementById('lightbox').classList.remove('show');
            document.body.style.overflow = '';
        }
    });

    // Catat kunjungan → Supabase
    async function recordView() {
        try {
            const key = 'view_recorded_/media';
            if (sessionStorage.getItem(key)) return;
            await db.from('page_views').insert([{
                ip_address: 'client',
                user_agent: navigator.userAgent,
                page: '/media',
                visited_at: new Date().toISOString()
            }]);
            sessionStorage.setItem(key, '1');
        } catch(e) {}
    }

    // ============================
    // VIDEO MODAL
    // ============================
    function openVideoModal(embedUrl, title) {
        document.getElementById('videoFrame').src = embedUrl;
        document.getElementById('videoModalTitle').textContent = title;
        document.getElementById('videoModal').classList.add('show');
        document.body.style.overflow = 'hidden';
    }

    function closeVideoModal(event) {
        if (event && !event.target.classList.contains('video-modal') && !event.target.closest('.video-modal-close')) return;
        document.getElementById('videoFrame').src = '';
        document.getElementById('videoModal').classList.remove('show');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeVideoModal({target: document.getElementById('videoModal')});
    });

    loadMedia();
    recordView();
</script>

</body>
</html>
